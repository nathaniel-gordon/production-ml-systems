[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "production-ml-systems"
version = "0.1.0"
description = "Reference design & testing suite for Production Machine Learning Systems: Dual-Storage Feature Stores, Real-Time Inference, Statistical Drift Detection & Canary Deployment Sagas."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = [
    "mlops", "feature-store", "data-drift", "population-stability-index",
    "ks-test", "model-serving", "triton", "ray-serve", "canary-deployment"
]
authors = [{ name = "Nathaniel Gordon", email = "nathanielgordon346@gmail.com" }]
urls = { Homepage = "https://github.com/nathaniel-gordon/production-ml-systems", Repository = "https://github.com/nathaniel-gordon/production-ml-systems" }

dependencies = [
    "numpy>=1.24.0",
    "scipy>=1.10.0",
]

[project.optional-dependencies]
dev = ["pytest>=7.0.0"]

[project.scripts]
mldrift = "demo.drift_detector:main"
mlfeatures = "demo.feature_store_simulator:main"
mllatency = "demo.latency_monitor:main"

[tool.hatch.build.targets.wheel]
packages = ["demo"]
