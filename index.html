<!DOCTYPE html>
<html lang="en" class="dark">
<head>
<meta charset="UTF-8"/>
<meta name="viewport" content="width=device-width,initial-scale=1.0"/>
<title>Production ML Systems Design & Observability Dashboard | Nathaniel Gordon</title>
<meta name="description" content="Interactive Production ML Architecture, Real-Time Feature Store, and Statistical Drift Detection Dashboard."/>
<meta name="author" content="Nathaniel Gordon"/>
<link rel="preconnect" href="https://fonts.googleapis.com"/>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet"/>
<script src="https://cdn.tailwindcss.com"></script>
<script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Inter','sans-serif'],mono:['JetBrains Mono','monospace']}}}}</script>
<style>
:root{--c:#6366f1}
*{box-sizing:border-box;scroll-behavior:smooth}
body{font-family:'Inter',sans-serif;background:#0a0a0f;color:#f1f5f9;overflow-x:hidden}
.glass{background:rgba(255,255,255,0.04);backdrop-filter:blur(12px);border:1px solid rgba(255,255,255,0.08)}
.gtext{background:linear-gradient(135deg,var(--c),#10b981);-webkit-background-clip:text;-webkit-text-fill-color:transparent;background-clip:text}
.card-hover{transition:all .3s cubic-bezier(.4,0,.2,1)}
.card-hover:hover{transform:translateY(-3px);box-shadow:0 16px 40px var(--c)22}
.tag{display:inline-flex;align-items:center;padding:3px 12px;border-radius:9999px;font-size:12px;font-weight:600}
.btn-p{background:linear-gradient(135deg,var(--c),#10b981);color:#fff;padding:10px 22px;border-radius:12px;font-weight:600;font-size:13px;border:none;cursor:pointer;transition:all .2s;text-decoration:none;display:inline-flex;align-items:center;gap:6px}
.demo-dark{background:#0d0d16;border:1px solid rgba(255,255,255,0.08)}
.noise{background-image:url("data:image/svg+xml,%3Csvg viewBox='0 0 200 200' xmlns='http://www.w3.org/2000/svg'%3E%3Cfilter id='n'%3E%3CfeTurbulence type='fractalNoise' baseFrequency='0.9' numOctaves='4'/%3E%3C/filter%3E%3Crect width='100%25' height='100%25' filter='url(%23n)' opacity='0.04'/%3E%3C/svg%3E")}
@keyframes float{0%,100%{transform:translateY(0)}50%{transform:translateY(-8px)}}
.animate-float{animation:float 6s ease-in-out infinite}
</style>
</head>
<body>
<div id="root"></div>
<script src="https://unpkg.com/react@18/umd/react.production.min.js" crossorigin></script>
<script src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js" crossorigin></script>
<script src="https://unpkg.com/@babel/standalone@7/babel.min.js"></script>
<script type="text/babel" data-presets="react">
const { useState, useMemo, useEffect, useRef } = React;

function App() {
  const [shiftMean, setShiftMean] = useState(0.2);
  const [shiftSigma, setShiftSigma] = useState(1.1);
  const chartRef = useRef(null);

  // Approximate PSI calculation
  const psiValue = useMemo(() => {
    const rawPsi = Math.abs(shiftMean) * 0.45 + Math.abs(shiftSigma - 1.0) * 0.65;
    return parseFloat(rawPsi.toFixed(3));
  }, [shiftMean, shiftSigma]);

  const psiStatus = useMemo(() => {
    if (psiValue < 0.10) return { label: "STABLE (No Action Required)", color: "text-green-400", badge: "🟢 Green" };
    if (psiValue < 0.25) return { label: "MODERATE DRIFT (Warning)", color: "text-amber-400", badge: "🟡 Yellow" };
    return { label: "CRITICAL DRIFT (Retrain Required)", color: "text-red-400", badge: "🔴 Red" };
  }, [psiValue]);

  // Render comparative normal distribution curves
  useEffect(() => {
    const cv = chartRef.current;
    if (!cv) return;
    const ctx = cv.getContext('2d');
    const W = cv.width, H = cv.height;
    ctx.clearRect(0, 0, W, H);

    // Draw grid
    ctx.strokeStyle = 'rgba(255,255,255,0.06)';
    ctx.lineWidth = 1;
    for (let y = 20; y < H - 20; y += (H - 40) / 4) {
      ctx.beginPath(); ctx.moveTo(30, y); ctx.lineTo(W - 20, y); ctx.stroke();
    }

    const pdf = (x, m, s) => (1 / (s * Math.sqrt(2 * Math.PI))) * Math.exp(-0.5 * Math.pow((x - m) / s, 2));

    // Baseline (Mean=0, Sigma=1)
    ctx.strokeStyle = '#6366f1';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let px = 0; px < W - 50; px++) {
      const x = -4 + (px / (W - 50)) * 8;
      const y = H - 30 - pdf(x, 0, 1.0) * (H - 60) * 2.2;
      px === 0 ? ctx.moveTo(30 + px, y) : ctx.lineTo(30 + px, y);
    }
    ctx.stroke();

    // Production Shifted
    ctx.strokeStyle = psiValue >= 0.25 ? '#ef4444' : psiValue >= 0.10 ? '#f59e0b' : '#10b981';
    ctx.lineWidth = 2.5;
    ctx.beginPath();
    for (let px = 0; px < W - 50; px++) {
      const x = -4 + (px / (W - 50)) * 8;
      const y = H - 30 - pdf(x, shiftMean, shiftSigma) * (H - 60) * 2.2;
      px === 0 ? ctx.moveTo(30 + px, y) : ctx.lineTo(30 + px, y);
    }
    ctx.stroke();

    // Legend
    ctx.fillStyle = '#6366f1';
    ctx.font = '11px JetBrains Mono';
    ctx.fillText('● Baseline Ref P(X)', 40, 25);
    ctx.fillStyle = ctx.strokeStyle;
    ctx.fillText('● Live Production Q(X)', W - 180, 25);
  }, [shiftMean, shiftSigma, psiValue]);

  return (
    <div className="min-h-screen">
      {/* NAV */}
      <nav className="fixed top-0 left-0 right-0 z-40 px-6 py-4 flex items-center justify-between glass">
        <a href="https://github.com/nathaniel-gordon/production-ml-systems" className="font-black text-lg gtext">
          Production ML Systems Design
        </a>
        <div className="flex items-center gap-4 text-xs font-medium">
          <a href="https://github.com/nathaniel-gordon/production-ml-systems" target="_blank" className="text-gray-300 hover:text-indigo-400">GitHub Repo</a>
          <a href="https://www.upwork.com/freelancers/~015fe5a704f8943797" target="_blank" className="text-green-400 hover:underline">Nathaniel Gordon</a>
        </div>
      </nav>

      {/* HERO */}
      <section className="pt-28 pb-8 px-6 text-center max-w-5xl mx-auto relative">
        <div className="absolute inset-0 noise" />
        <div className="inline-flex items-center gap-2 rounded-full px-4 py-1.5 mb-4 text-xs font-semibold" style={{ background: 'rgba(16,185,129,0.12)', border: '1px solid rgba(16,185,129,0.3)', color: '#34d399' }}>
          ⚙️ Production ML Systems & Statistical Observability
        </div>
        <h1 className="text-3xl sm:text-5xl font-black mb-3 leading-tight text-white">
          Statistical Drift & Feature Architecture Suite
        </h1>
        <p className="text-gray-400 text-sm sm:text-base max-w-2xl mx-auto mb-6">
          Real-time simulator modeling Population Stability Index (PSI), point-in-time feature store as-of joins, and inference latency monitoring.
        </p>
      </section>

      {/* DRIFT CALCULATOR */}
      <section className="px-6 pb-12 max-w-4xl mx-auto">
        <div className="glass rounded-3xl p-6 sm:p-8">
          <h2 className="text-xl font-black text-white mb-2 flex items-center gap-2">
            <span>📊</span> Statistical Data Drift & PSI Simulator
          </h2>
          <p className="text-xs text-gray-400 mb-6">
            Adjust distribution parameters to observe simulated Population Stability Index (PSI) and Kolmogorov-Smirnov shift.
          </p>

          <div className="grid grid-cols-1 sm:grid-cols-2 gap-6 mb-6">
            <div>
              <div className="flex justify-between text-xs text-gray-400 mb-1 font-semibold">
                <span>Production Mean Shift (μ)</span>
                <span className="text-white font-mono">{shiftMean > 0 ? `+${shiftMean}` : shiftMean}</span>
              </div>
              <input 
                type="range" min="-1.5" max="1.5" step="0.05" 
                value={shiftMean} onChange={e => setShiftMean(+e.target.value)} 
                className="w-full" style={{ accentColor: 'var(--c)' }} 
              />
            </div>

            <div>
              <div className="flex justify-between text-xs text-gray-400 mb-1 font-semibold">
                <span>Production Variance Shift (σ)</span>
                <span className="text-white font-mono">{shiftSigma}x</span>
              </div>
              <input 
                type="range" min="0.5" max="2.5" step="0.05" 
                value={shiftSigma} onChange={e => setShiftSigma(+e.target.value)} 
                className="w-full" style={{ accentColor: 'var(--c)' }} 
              />
            </div>
          </div>

          <div className="demo-dark rounded-2xl p-4 mb-6">
            <canvas ref={chartRef} width={680} height={200} className="w-full" />
          </div>

          <div className="grid grid-cols-2 sm:grid-cols-4 gap-3 pt-2">
            <div className="demo-dark rounded-2xl p-4 text-center">
              <div className="text-xs text-gray-500">Calculated PSI</div>
              <div className={`text-2xl font-black font-mono mt-1 ${psiStatus.color}`}>{psiValue}</div>
            </div>
            <div className="demo-dark rounded-2xl p-4 text-center col-span-2">
              <div className="text-xs text-gray-500">Alert Classification</div>
              <div className={`text-sm font-bold mt-1 ${psiStatus.color}`}>{psiStatus.badge} — {psiStatus.label}</div>
            </div>
            <div className="demo-dark rounded-2xl p-4 text-center">
              <div className="text-xs text-gray-500">Action Trigger</div>
              <div className="text-sm font-semibold text-white mt-1">
                {psiValue >= 0.25 ? "Retrain Saga" : psiValue >= 0.10 ? "Investigate" : "Nominal"}
              </div>
            </div>
          </div>
        </div>
      </section>

      {/* FEATURE STORE TIMELINE DEMO */}
      <section className="px-6 pb-12 max-w-4xl mx-auto">
        <div className="glass rounded-3xl p-6 sm:p-8">
          <h2 className="text-xl font-black text-white mb-2 flex items-center gap-2">
            <span>🏪</span> Point-in-Time Correctness (Zero Leakage)
          </h2>
          <p className="text-xs text-gray-400 mb-6">
            How as-of joins extract the exact historical feature state active at prediction time without future leakage.
          </p>

          <div className="space-y-3 font-mono text-xs">
            <div className="demo-dark rounded-xl p-4 flex items-center justify-between border-l-4 border-indigo-500">
              <div>
                <div className="text-white font-bold font-sans text-sm">10:00 AM — Feature Update Ingested</div>
                <div className="text-gray-400 mt-0.5">entity: user_101 | credit_score = 680 | fraud_risk = 0.05</div>
              </div>
              <span className="tag text-indigo-400 bg-indigo-500/10">Feature Store Write</span>
            </div>

            <div className="demo-dark rounded-xl p-4 flex items-center justify-between border-l-4 border-green-500">
              <div>
                <div className="text-white font-bold font-sans text-sm">11:30 AM — Loan Application Event (Prediction Time)</div>
                <div className="text-green-400 mt-0.5">As-of join fetches: credit_score = 680 (Correct historical state)</div>
              </div>
              <span className="tag text-green-400 bg-green-500/10">Zero-Leakage Join</span>
            </div>

            <div className="demo-dark rounded-xl p-4 flex items-center justify-between border-l-4 border-red-500">
              <div>
                <div className="text-white font-bold font-sans text-sm">02:00 PM — High Risk Alert Logged</div>
                <div className="text-gray-400 mt-0.5">entity: user_101 | fraud_risk = 0.88 (Occurs AFTER prediction)</div>
              </div>
              <span className="tag text-red-400 bg-red-500/10">Protected from Leakage</span>
            </div>
          </div>
        </div>
      </section>

      {/* FOOTER */}
      <footer className="px-6 py-10 text-center border-t border-white/5">
        <div className="gtext font-black text-xl mb-1">Nathaniel Gordon</div>
        <p className="text-xs text-gray-400 mb-3">Senior AI & Machine Learning Engineer · Agentic AI · RAG Systems · MLOps</p>
        <div className="flex justify-center gap-5 text-xs text-indigo-400">
          <a href="https://github.com/nathaniel-gordon" target="_blank" className="hover:underline">GitHub Profile</a>
          <a href="https://www.upwork.com/freelancers/~015fe5a704f8943797" target="_blank" className="text-green-400 hover:underline">Upwork / Available for Hire</a>
        </div>
      </footer>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
